# =============================================================================
# Parameter JKN-Sentinel
# =============================================================================
# Semua batas yang dipakai mesin aturan, sensor, dan evaluasi dibaca dari file
# ini (prinsip 4: parameter tidak di-hardcode).
#
# PERHATIAN: seluruh nilai di bawah ini ILUSTRATIF, wajib divalidasi bersama
# BPJS dan organisasi profesi sebelum dipakai di luar prototipe.
# Status validasi tiap parameter dicatat di ROADMAP.md bagian
# "Parameter yang wajib divalidasi".
#
# File ini divalidasi oleh backend/sentinel/parameter.py (pydantic).
# Kunci yang tidak dikenal akan ditolak agar salah ketik tidak lolos diam-diam.
# =============================================================================

versi_skema: 1

kapasitas:
  # Arti   : jumlah sesi fisioterapi yang wajar dilayani satu terapis dalam sehari.
  # Satuan : sesi per terapis per hari.
  # Aturan : KAP-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  fisioterapi_sesi_per_terapis_per_hari: 8

  # Arti   : lama satu sesi hemodialisa, dipakai untuk menghitung kapasitas mesin.
  # Satuan : jam per sesi.
  # Aturan : KAP-02, SEN-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  hemodialisa_durasi_sesi_jam: 4

  # Arti   : jumlah shift hemodialisa per mesin dalam sehari.
  # Satuan : shift per mesin per hari.
  # Aturan : KAP-02.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  hemodialisa_shift_per_hari: 3

kewajaran:
  # Arti   : batas selisih harga tagihan di atas harga acuan sebelum ditandai.
  # Satuan : persen (10 berarti tagihan > 110% harga acuan ditandai).
  # Aturan : WJR-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  toleransi_harga_di_atas_acuan_persen: 10

  # Arti   : masa minimum sebelum alat bantu dengar boleh diganti.
  # Satuan : tahun, dihitung per telinga (kiri dan kanan terpisah).
  # Aturan : WJR-02.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi;
  #          cocokkan dengan regulasi yang berlaku.
  alat_bantu_dengar_masa_penggantian_tahun: 5
  alat_bantu_dengar_per_telinga: true

perbandingan:
  # Arti   : ambang robust z-score (berbasis median dan MAD) untuk menandai
  #          rumah sakit yang menyimpang dari rumah sakit sejenis.
  # Satuan : tanpa satuan (kelipatan MAD terskala).
  # Aturan : BAND-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  ambang_robust_z: 3.0

sensor:
  # Arti   : toleransi selisih antara jam-mesin terapi tercatat sensor dan jam
  #          yang seharusnya terpakai untuk sesi yang ditagih.
  # Satuan : persen (10 berarti selisih > 10% ditandai).
  # Aturan : SEN-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  toleransi_selisih_jam_mesin_persen: 10

  # Arti   : bila data sensor sebuah RS pada satu hari hilang melebihi batas ini, SEN-01
  #          TIDAK menghitung selisih jam (tidak menuduh dari data bolong) dan membuat
  #          temuan integritas sebagai gantinya. Dihitung dari seluruh menit-perangkat
  #          RS itu pada hari tersebut (jumlah perangkat aktif x 1440 menit).
  # Satuan : persen.
  # Aturan : SEN-01.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  batas_data_hilang_persen: 5

  # Arti   : heartbeat perangkat yang hilang lebih dari N jendela berturut-turut dianggap
  #          sensor dicabut/dimatikan (TAMPER_GAP).
  # Satuan : jendela (default panjang jendela 10 menit, jadi 3 jendela = 30 menit).
  # Aturan : SEN-01 (integritas).
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  gap_maks_jendela: 3

# -----------------------------------------------------------------------------
# Bobot skor per aturan
# -----------------------------------------------------------------------------
# Arti   : kontribusi maksimum setiap aturan terhadap skor prioritas 0-100 per
#          rumah sakit per periode. Jumlah semua bobot wajib 100.
# Satuan : poin skor.
# Catatan: nilai awal, akan disetel di fase 2 (mesin aturan).
#          ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
bobot_aturan:
  KAP-01: 15   # kapasitas fisioterapi terlampaui
  KAP-02: 15   # kapasitas hemodialisa terlampaui
  ULG-01: 15   # tagihan identik berulang
  ULG-02: 10   # sesi ganda untuk pasien yang sama di hari yang sama
  WJR-01: 10   # harga di atas harga acuan
  WJR-02: 10   # alat bantu dengar sebelum masa penggantian
  BAND-01: 5   # menyimpang dari rumah sakit sejenis
  SEN-01: 20   # jam-mesin sensor tidak cocok dengan sesi ditagih

# -----------------------------------------------------------------------------
# Skor prioritas (fase 2)
# -----------------------------------------------------------------------------
# skor = jumlah (bobot_aturan x keparahan_aturan), keparahan 0-1, sehingga skor 0-100.
# Keparahan aturan berbasis hitungan (KAP, ULG, WJR)
#   = min(1, jumlah temuan dalam satu periode (bulan) / titik_jenuh).
# Keparahan SEN-01 = maksimum dari keparahan selisih dan keparahan integritas, masing-masing
#   min(1, jumlah temuan kategori itu dalam sebulan / titik_jenuh kategorinya).
# Keparahan BAND-01 = min(1, (z - ambang_robust_z) / ambang_robust_z) jika z > ambang.
skor:
  # Arti   : jumlah temuan per rumah sakit per bulan yang dianggap keparahan penuh (1,0).
  # Satuan : temuan per bulan.
  # Catatan: ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  titik_jenuh:
    KAP-01: 3
    KAP-02: 3
    ULG-01: 3
    ULG-02: 3
    WJR-01: 3
    WJR-02: 2
    SEN-01-selisih: 3      # temuan selisih jam-mesin terapi vs sesi ditagih
    SEN-01-integritas: 2   # temuan integritas: TAMPER_SIG/CHAIN/GAP dan hari data bolong

  # Arti   : batas bawah skor untuk tiap tingkat prioritas pemeriksaan
  #          (skor >= tinggi -> tinggi; skor >= sedang -> sedang; selain itu rendah).
  # Satuan : poin skor (0-100). Sejak fase 3 SEN-01 aktif, skor maksimum 100.
  # Catatan: ditetapkan dari sebaran skor dataset utama saja (lihat DEVLOG fase 2).
  #          ILUSTRATIF, wajib divalidasi bersama BPJS dan organisasi profesi.
  prioritas:
    tinggi: 20
    sedang: 10

  # Arti   : LANTAI PRIORITAS. Bila salah satu aturan bukti fisik di bawah mencapai
  #          keparahan 1 (titik jenuh) dalam satu periode, prioritas RS itu minimal "tinggi"
  #          berapa pun skornya. Skor tidak berubah; hanya label prioritas.
  # Alasan : kapasitas fisik yang terlampaui berulang kali (tenaga, mesin) dan jam-mesin
  #          yang tidak cukup untuk sesi yang ditagih adalah bukti terkuat di sistem;
  #          bukti itu tidak boleh berakhir di prioritas sedang hanya karena bobot satu
  #          aturan dibatasi (mis. 15). Keputusan prinsip, bukan hasil melihat label.
  # Nilai  : kunci titik_jenuh (SEN-01 hanya kategori selisih, bukan integritas).
  # Catatan: daftar boleh diubah; wajib divalidasi bersama BPJS.
  aturan_bukti_fisik: [KAP-01, KAP-02, SEN-01-selisih]
